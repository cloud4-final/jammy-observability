groups:
  - name: site_connectivity_and_health
    rules:
      # 1. 개별 타겟 장애 (Site Collector는 정상인데 특정 VM/서비스만 죽었을 때)
      - alert: InstanceDown
        expr: up{vantage=""} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.instance }} down on {{ $labels.site }}"
          description: "Target {{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 1 minute."

      # 2. 거점 전체 단절 감지 (해당 거점의 모든 scrape 대상이 동시에 응답 없을 때)
      - alert: SiteNetworkPartition
        expr: sum by (site) (up{vantage=""}) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "수집은 되지만 모든 타겟 up=0 (site: {{ $labels.site }})"
          description: "All monitoring targets in {{ $labels.site }} are completely unreachable. Likely VPN or ISP link failure."

      # 3. 고에러율 감지 (애플리케이션 계층)
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[2m])) by (site, endpoint)
          /
          sum(rate(http_requests_total[2m])) by (site, endpoint) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.endpoint }} (site: {{ $labels.site }})"
          description: "5xx error rate exceeds 5% for the last 2 minutes."

      # 4. 외부 프로브 장애 (obs에서 거점으로의 ICMP ping 실패)
      - alert: SiteProbeDown
        expr: probe_success{job="blackbox_icmp",vantage="jammy-obs"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ICMP probe failed from jammy-obs to site: {{ $labels.site }}"
          description: "Blackbox ICMP probe to {{ $labels.site }} ({{ $labels.instance }}) from jammy-obs has been failing for more than 2 minutes."

      # 5. 거점 원격 전송 단절 (데이터 누락/침묵 상태 감지)
      - alert: SiteTelemetryMissing
        expr: group by (site) (up{site=~"jammy-[abc]",vantage=""} offset 10m) unless group by (site) (up{site=~"jammy-[abc]",vantage=""})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Unknown: 데이터 없음(다운 확정 아님) - site: {{ $labels.site }}"
          description: "No scrape or remote_write metrics received from {{ $labels.site }} for more than 10 minutes. Node might be isolated, down, or remote-write halted."

      # 6. 중앙 Prometheus Remote Write 수신/전송 실패
      - alert: RemoteWriteFailing
        expr: rate(prometheus_remote_storage_samples_failed_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Remote write storage samples failing"
          description: "Prometheus remote storage samples failed at rate > 0 for 10 minutes."

      # 7. 중앙 관측 허브 디스크 부족
      - alert: HubDiskLow
        expr: node_filesystem_avail_bytes{job="node",site="jammy-obs",mountpoint="/"} / node_filesystem_size_bytes{job="node",site="jammy-obs",mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Root disk low on jammy-obs (< 15% available)"
          description: "Host root filesystem available space on jammy-obs is below 15% for more than 10 minutes."
  - name: postgres_replication
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: PostgresExporterDown
          description: "Check the Data VM, replication connections and disk. 잠정값, k6 시험 후 조정"
      - alert: PostgresDown
        expr: pg_up{job="postgres"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: PostgresDown
          description: "Check the Data VM, replication connections and disk. 잠정값, k6 시험 후 조정"
      - alert: ReplicaNotStreaming
        expr: (pg_replication_is_replica{job="postgres"} == 0) unless on (site, instance) (count by (site, instance) (pg_stat_replication_pg_wal_lsn_diff{job="postgres",state="streaming"}) >= 2)
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: ReplicaNotStreaming
          description: "Check the Data VM, replication connections and disk. 잠정값, k6 시험 후 조정"
      - alert: ReplicationLagHigh
        expr: pg_stat_replication_pg_wal_lsn_diff{state="streaming"} > 67108864
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: ReplicationLagHigh
          description: "Check the Data VM, replication connections and disk. 잠정값, k6 시험 후 조정"
      - alert: ReplicationSlotInactive
        expr: pg_replication_slot_slot_is_active == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: ReplicationSlotInactive
          description: "Check the Data VM, replication connections and disk. 잠정값, k6 시험 후 조정"
      - alert: ReplicationSlotWalRetained
        expr: pg_replication_slots_pg_wal_lsn_diff > 1073741824
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: ReplicationSlotWalRetained
          description: "Check the Data VM, replication connections and disk. 잠정값, k6 시험 후 조정"
      - alert: MultiplePrimaries
        expr: count(pg_replication_is_replica{job="postgres"} == 0) > 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: MultiplePrimaries
          description: "Check the Data VM, replication connections and disk. 잠정값, k6 시험 후 조정"
  - name: data_vm_health
    rules:
      - alert: DataVmNodeExporterDown
        expr: up{job="node_datavm"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: DataVmNodeExporterDown
          description: "Check the Data VM node exporter and network path. 잠정값, k6 시험 후 조정"
      - alert: DataVmDiskLow
        expr: (node_filesystem_avail_bytes{job="node_datavm",mountpoint="/srv/postgresql"} / node_filesystem_size_bytes{job="node_datavm",mountpoint="/srv/postgresql"} < 0.20) and (node_filesystem_avail_bytes{job="node_datavm",mountpoint="/srv/postgresql"} / node_filesystem_size_bytes{job="node_datavm",mountpoint="/srv/postgresql"} >= 0.10)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: DataVmDiskLow
          description: "Check available disk space on the Data VM. 잠정값, k6 시험 후 조정"
      - alert: DataVmDiskLow
        expr: node_filesystem_avail_bytes{job="node_datavm",mountpoint="/srv/postgresql"} / node_filesystem_size_bytes{job="node_datavm",mountpoint="/srv/postgresql"} < 0.10
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: DataVmDiskLow
          description: "Check available disk space on the Data VM. 잠정값, k6 시험 후 조정"
