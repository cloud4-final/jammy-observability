global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: slack-jammy-alerts
  group_by:
    - alertname
    - site
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: slack-jammy-alerts-critical
      repeat_interval: 1h

inhibit_rules:
  # Whole-site loss explains every per-target alert of that site.
  - source_matchers:
      - alertname = SiteProbeDown
    target_matchers:
      - alertname =~ "InstanceDown|SiteTelemetryMissing"
    equal:
      - site
  - source_matchers:
      - alertname =~ "SiteProbeDown|SiteTelemetryMissing"
    target_matchers:
      - alertname =~ "PostgresExporterDown|PostgresDown|ReplicaNotStreaming|ReplicationLagHigh|ReplicationSlotInactive|ReplicationSlotWalRetained|DataVmNodeExporterDown|DataVmDiskLow"
    equal:
      - site
  # A dead exporter explains the generic target-down alert for the same target.
  - source_matchers:
      - alertname =~ "PostgresExporterDown|DataVmNodeExporterDown"
    target_matchers:
      - alertname = InstanceDown
    equal:
      - site
      - instance
  # Without the exporter, DB-level alerts of that site are not trustworthy.
  - source_matchers:
      - alertname = PostgresExporterDown
    target_matchers:
      - alertname =~ "PostgresDown|ReplicationLagHigh|ReplicationSlotInactive|ReplicationSlotWalRetained"
    equal:
      - site
  - source_matchers:
      - alertname = DataVmNodeExporterDown
    target_matchers:
      - alertname = DataVmDiskLow
    equal:
      - site
  # Critical disk alert replaces the warning one.
  - source_matchers:
      - alertname = DataVmDiskLow
      - severity = critical
    target_matchers:
      - alertname = DataVmDiskLow
      - severity = warning
    equal:
      - site

receivers:
  # Slack workspace teamjammyjammy, channel #jammy-alerts (channel is bound to the webhook).
  - name: slack-jammy-alerts
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '{{ template "jammy.slack.title" . }}'
        text: '{{ template "jammy.slack.text" . }}'
  - name: slack-jammy-alerts-critical
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '{{ template "jammy.slack.title" . }}'
        text: '{{ if eq .Status "firing" }}<!here> {{ end }}{{ template "jammy.slack.text" . }}'
