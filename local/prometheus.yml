global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'jammy-hybrid'

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          site: 'central'
          layer: 'central-obs'

  # 모빌리티 수집기 애플리케이션
  - job_name: 'mobility-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000', 'collector:8000']
        labels:
          site: 'site-a'
          layer: 'app'
          service: 'mobility-collector'

  # KVM / Host 레벨 (libvirt exporter 연동 준비)
  - job_name: 'libvirt-exporter'
    static_configs:
      - targets: ['host.docker.internal:9177']
        labels:
          site: 'site-a'
          layer: 'host'
          role: 'kvm-hypervisor'

  # Node Exporter (OS 메트릭)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          site: 'site-a'
          layer: 'host'
